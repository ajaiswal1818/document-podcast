[project]
name = "document-podcast"
version = "0.1.0"
description = "Generate podcast audio from source documents using local MLX models."
readme = "README.md"
authors = [
    { name = "Abhishek Jaiswal", email = "ajaiswal9043@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx",
    "mlx-lm",
    "pymupdf",
    "pydantic",
    "rich",
    "tqdm",
    "numpy",
    "soundfile",
    "kokoro-mlx",
    "cartesia[websockets]>=4.0.1",
    "openai>=1.0",
    "pytest>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dia = ["mlx-audio", "librosa"]

[project.scripts]
document-podcast = "podcast.cli:main"
document-podcast-web = "podcast.web.app:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
